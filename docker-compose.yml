version: '2'
services:
  db:
    image: mariadb:10.6
    # networks:
    #   main:
    #     aliases:
    #       - db
    volumes:
      - "/var/lib/mysql"
      - "./db/init:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: magento
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3306:3306"

  redis:
    image: redis:7.2.6
    ports:
      - "6379:6379"
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    # networks:
    #   main:
    #     aliases:
    #       - redis       

  mailcatcher:
    image: yappabe/mailcatcher
    ports:
        - "1025:1025"
        - "1080:1080"

  fpm:
    depends_on:
      - mailcatcher
      - db
      - opensearch
      - rabbitmq
    # networks:
    #   main:
    #     aliases:
    #       - fpm
    build: ./fpm
    restart: always 
    volumes:
      - "./www:/var/www/html"
      - "./fpm/customized.ini:/usr/local/etc/php/conf.d/customized.ini"      
  http:
    depends_on:
      - fpm
    # networks:
    #   main:
    #     aliases:
    #       - nginx
    image: nginx:latest
    volumes:
      - "./conf/http/nginx.conf:/etc/nginx/nginx.conf"
      - "./conf/http/conf.d:/etc/nginx/conf.d"
      - "./www:/var/www/html"
    ports:
      - "8080:80"

  https:
    depends_on:
      - varnish
      - http
    # networks:
    #   main:
    #     aliases:
    #       - https
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - "./conf/https/nginx.conf:/etc/nginx/nginx.conf"
      - "./conf/https/conf.d:/etc/nginx/conf.d"
      - "./conf/certs:/etc/nginx/ssl"

  varnish:
    image: varnish:latest
    depends_on:
      - http
    # networks:
    #   main:
    #     aliases:
    #       - varnish 
    ports:
      - "80:6081"
      - "6085:6085"
    volumes:
      - "./conf/varnish/varnish.vcl:/etc/varnish/conf.d/varnish.vcl"
    environment:
      BACKENDS: "http"
      BACKENDS_PORT: "80"
      BACKENDS_PROBE_INTERVAL: "3s"
      BACKENDS_PROBE_TIMEOUT: "1s"
      BACKENDS_PROBE_WINDOW: "3"
      BACKENDS_PROBE_THRESHOLD: "2"
      DASHBOARD_USER: "admin"
      DASHBOARD_PASSWORD: "admin"
      DASHBOARD_SERVERS: "varnish"

  phpmyadmin:
    depends_on:
      - db  
    image: phpmyadmin/phpmyadmin
    environment:
     - PMA_ARBITRARY=1
    ports:
     - 8888:80
    volumes:
     - /sessions

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set min and max JVM heap sizes to at least 50% of system RAM      
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=j6Zv15K0Tu1j
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536      
    ports:
      - 9200:9200 # REST API
      - 9600:9600 # Performance Analyzer      
    # networks:
    #   main:
    #     aliases:
    #       - elasticsearch
  
  rabbitmq:
    image: rabbitmq:3.13
    ports:
      - 5672:5672
      - 15672:15672

# networks:
#   main: